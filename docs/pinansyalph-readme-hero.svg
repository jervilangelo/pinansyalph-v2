<rect x="15" y="15" width="274" height="194" fill="none" stroke="#A5A59D" stroke-width="2"/>
<path d="M55 44H249M55 178H249" stroke="#B5B5AE" stroke-width="2"/>
<circle cx="152" cy="112" r="74" fill="none" stroke="#898983" stroke-width="3"/>
<circle cx="152" cy="112" r="62" fill="#E7E7E4"/>
<text x="152" y="145" font-family="Georgia,serif" font-size="104" font-weight="700" text-anchor="middle" fill="#6F706A">₱</text>
<text x="24" y="198" font-family="Arial,sans-serif" font-size="13" fill="#777872" letter-spacing="1.4">PHILIPPINE PESO</text>
