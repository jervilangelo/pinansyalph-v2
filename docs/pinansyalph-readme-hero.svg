<rect x="18" y="16" width="183" height="31" fill="#F3F3F1" opacity=".93"/>
<text x="31" y="37" font-family="'Instrument Sans',Arial,sans-serif" font-size="13" fill="#3D3C38">Your money, in context</text>
</g>
<!-- Dark tile: the central question from the live website -->
<g class="enter" font-family="'Literata',Georgia,'Times New Roman',serif">
<text x="53" y="378" font-size="27" fill="#F3F3F1">Your money is growing.</text>
<text x="53" y="414" font-size="27" fill="#F3F3F1">But is its value growing too?</text>
</g>
<g font-family="'Instrument Sans',Arial,sans-serif">
