<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
<title id="title">PinansyalPH — Mas malinaw ang pera mo.</title>
<desc id="desc">Financial literacy tools for the Philippines. Animated illustrative savings and purchasing-power chart with blue and green elements.</desc>
<style>
@keyframes grow { 0%,8% { transform:scaleY(.05); opacity:.2 } 35%,86%,100% { transform:scaleY(1); opacity:1 } }
@keyframes linein { 0%,8% { stroke-dashoffset:490; opacity:.35 } 38%,89%,100% { stroke-dashoffset:0; opacity:1 } }
@keyframes glow { 0%,65%,100% { opacity:.12; transform:scale(.75) } 80% { opacity:.32; transform:scale(1.6) } }
@keyframes softly { 0%,58%,100% { opacity:1 } 76% { opacity:.68 } }
.chart-bar { transform-box:fill-box; transform-origin:center bottom; animation:grow 8s cubic-bezier(.22,1,.36,1) infinite; }
.bar-b { animation-delay:.18s }.bar-c { animation-delay:.36s }.bar-d { animation-delay:.54s }.bar-e { animation-delay:.72s }
.chart-line { stroke-dasharray:490; stroke-dashoffset:0; animation:linein 8s cubic-bezier(.22,1,.36,1) infinite; }
.focus-halo { transform-box:fill-box; transform-origin:center; animation:glow 8s ease-in-out infinite; }
.focus-value { animation:softly 8s ease-in-out infinite; }
@media (prefers-reduced-motion:reduce) { .chart-bar,.chart-line,.focus-halo,.focus-value { animation:none!important } }
</style>
<rect width="1200" height="470" rx="20" fill="#F3F3F1"/>
<rect x="0" y="0" width="12" height="470" fill="#1D4E89"/>
<g font-family="Arial,Helvetica,sans-serif">
<rect x="65" y="53" width="38" height="38" fill="#151514"/><text x="84" y="80" text-anchor="middle" fill="#F3F3F1" font-size="21" font-weight="700">₱</text>
<text x="117" y="81" font-size="33" font-weight="700" letter-spacing="-1.3" fill="#151514">PinansyalPH</text>
<text x="66" y="170" font-size="48" font-weight="700" letter-spacing="-2" fill="#151514">Mas malinaw</text>
<text x="66" y="224" font-size="48" font-weight="700" letter-spacing="-2" fill="#1D4E89">ang pera mo.</text>
<text x="67" y="274" font-size="19" fill="#3D3C38">Sweldo, ipon, 13th month, at inflation.</text>
<text x="67" y="302" font-size="19" fill="#3D3C38">Understand the numbers. Decide for yourself.</text>
<rect x="65" y="341" width="144" height="35" fill="#151514"/><text x="137" y="363" fill="#F3F3F1" font-size="12" font-weight="700" text-anchor="middle" letter-spacing=".9">OPEN SOURCE</text>
<rect x="219" y="341" width="163" height="35" fill="#D7E3F1"/><text x="301" y="363" fill="#1D4E89" font-size="12" font-weight="700" text-anchor="middle" letter-spacing=".9">NO SIGN-UP</text>
</g>
<g transform="translate(613 59)" font-family="Arial,Helvetica,sans-serif">
<rect width="520" height="351" fill="#FBFBFA" stroke="#D9D9D5" stroke-width="2"/>
<rect width="520" height="51" fill="#E7E7E4"/>
<text x="23" y="32" font-weight="700" font-size="13" fill="#151514" letter-spacing=".6">YOUR MONEY, IN PERSPECTIVE</text>
<circle cx="481" cy="25" r="4" fill="#1D4E89"/><circle cx="496" cy="25" r="4" fill="#D9D9D5"/>
<text x="24" y="89" font-size="12" font-weight="700" fill="#5C5A54" letter-spacing=".8">ILLUSTRATIVE SAVINGS VIEW</text>
<text x="25" y="123" font-size="28" font-weight="700" fill="#151514">See the difference</text>
<text x="25" y="147" font-size="12" fill="#5C5A54">Future value vs. purchasing power</text>
<g stroke="#E7E7E4"><path d="M54 188H489M54 229H489M54 270H489M54 311H489"/></g>
<g fill="#D7E3F1">
<rect class="chart-bar" x="81" y="261" width="44" height="50"/>
<rect class="chart-bar bar-b" x="160" y="239" width="44" height="72"/>
<rect class="chart-bar bar-c" x="239" y="216" width="44" height="95"/>
<rect class="chart-bar bar-d" x="318" y="192" width="44" height="119"/>
<rect class="chart-bar bar-e" x="397" y="168" width="44" height="143"/>
</g>
<path class="chart-line" d="M103 279L182 263L261 248L340 237L419 227" fill="none" stroke="#2E6A46" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<circle class="focus-halo" cx="419" cy="227" r="14" fill="#2E6A46"/><circle cx="419" cy="227" r="5" fill="#2E6A46"/>
<g font-size="11" fill="#5C5A54"><text x="103" y="331" text-anchor="middle">1</text><text x="182" y="331" text-anchor="middle">2</text><text x="261" y="331" text-anchor="middle">3</text><text x="340" y="331" text-anchor="middle">4</text><text x="419" y="331" text-anchor="middle">5</text></g>
<g class="focus-value"><rect x="365" y="94" width="128" height="36" fill="#DCEBE0"/><text x="429" y="109" text-anchor="middle" font-weight="700" font-size="11" fill="#2E6A46">REAL VALUE</text><text x="429" y="122" text-anchor="middle" font-size="9" fill="#2E6A46">matters, too</text></g>
</g>
<g font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#5C5A54">
<text x="66" y="438" font-weight="700" letter-spacing="1.2">CALCULATE  /  COMPARE  /  UNDERSTAND</text>
<text x="1133" y="438" text-anchor="end">Free financial literacy tools for Filipinos</text>
</g>
</svg>