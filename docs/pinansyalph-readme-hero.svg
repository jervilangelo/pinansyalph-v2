<text x="72" y="64" font-size="14" font-weight="700" fill="#1D4E89" letter-spacing=".25">PinansyalPH · free financial literacy tools</text>
</g>
<g font-family="'Literata',Georgia,'Times New Roman',serif" fill="#151514">
<text x="54" y="133" font-size="52" letter-spacing="-1.9">Worth it ba</text>
<text x="54" y="193" font-size="52" letter-spacing="-1.9">sa Pilipinas?</text>
</g>
<path d="M54 215H560" stroke="#D9D9D5"/>
