<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<title id="title">PinansyalPH — Worth it ba sa Pilipinas?</title>
<desc id="desc">Editorial finance-themed banner inspired by the PinansyalPH homepage: large serif headline, monochrome peso illustration, black and blue statement panels, and subdued animated data elements.</desc>
<style>
@keyframes lift {0%,8%{opacity:.4;transform:translateY(11px)} 30%,86%,100%{opacity:1;transform:translateY(0)}}
@keyframes trace {0%,9%{stroke-dashoffset:280;opacity:.3} 39%,90%,100%{stroke-dashoffset:0;opacity:1}}
@keyframes bars {0%,7%{transform:scaleY(.09);opacity:.3} 35%,90%,100%{transform:scaleY(1);opacity:1}}
@keyframes dotpulse {0%,64%,100%{opacity:.18;transform:scale(.55)} 80%{opacity:.5;transform:scale(1.8)}}
.enter { animation:lift 8s cubic-bezier(.22,1,.36,1) infinite }
.enter2 { animation-delay:.2s }
.enter3 { animation-delay:.4s }
.spark { stroke-dasharray:280;animation:trace 8s cubic-bezier(.22,1,.36,1) infinite }
.bar { transform-box:fill-box;transform-origin:center bottom;animation:bars 8s cubic-bezier(.22,1,.36,1) infinite }
.b2 {animation-delay:.12s}.b3 {animation-delay:.24s}.b4 {animation-delay:.36s}.b5 {animation-delay:.48s}
.halo {transform-box:fill-box;transform-origin:center;animation:dotpulse 8s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.enter,.spark,.bar,.halo{animation:none!important}}
</style>
<rect width="1200" height="500" fill="#F3F3F1"/>
<!-- Website-inspired 8px gutters / flat editorial tiles -->
<rect x="24" y="24" width="578" height="296" fill="#FBFBFA"/>
<rect x="610" y="24" width="566" height="296" fill="#E7E7E4"/>
<rect x="24" y="328" width="578" height="148" fill="#151514"/>
<rect x="610" y="328" width="566" height="148" fill="#1D4E89"/>
