name: Update economic data

# PSA publishes CPI in the first week of each month, DOE posts its Oil Monitor
# weekly (adjustments take effect on Tuesdays), and Pag-IBIG declares MP2
# dividends once a year. A daily check is cheap and catches all three.
on:
  schedule:
    - cron: '17 1 * * *' # 09:17 Philippine time, daily
    - cron: '17 5 1-10 * *' # 13:17 PHT on CPI release days, a second pass
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: economic-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Each fetcher keeps the previous dataset when its source fails or its
      # output does not validate, and reports why in the job summary.
      - name: Inflation (PSA OpenSTAT API)
        run: npm run data:inflation
      - name: Fuel price adjustments (DOE Oil Monitor)
        run: npm run data:fuel
      - name: MP2 declaration watch (Pag-IBIG)
        run: npm run data:mp2
      - name: Bank rate verification (official pages)
        run: npm run data:banks

      - name: Validate every dataset
        run: npm run validate:data
      - name: Unit tests on the new data
        run: npm test

      - name: Commit changed datasets
        run: |
          if git diff --quiet -- src/data; then
            echo "No dataset changed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/*.json
          git commit -m "data: refresh economic datasets ($(date -u +%Y-%m-%d))"
          git push
          echo "Committed updated datasets." >> "$GITHUB_STEP_SUMMARY"
