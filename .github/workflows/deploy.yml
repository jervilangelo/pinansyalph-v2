name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Deploy again after the scheduled data job commits new figures
  # (pushes made with GITHUB_TOKEN do not trigger `push` workflows).
  workflow_run:
    workflows: ['Update economic data', 'Update salary data']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate datasets
        run: npm run validate:data
      - name: Lint
        run: npm run lint
      - name: Unit tests (calculators and ingestion parsers)
        run: npm test
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests (production build)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/configure-pages@v5
      - name: Build for https://pinansyalph.site
        env:
          # The custom domain serves the site from the root. Set explicitly so a
          # build never picks up the old /pinansyalph-v2/ project-page path.
          BASE_PATH: /
        run: npm run build
      - name: Check the build targets the custom domain
        run: |
          test "$(cat dist/CNAME)" = "pinansyalph.site"
          test -f dist/mp2.html && test -f dist/sitemap.xml && test -f dist/robots.txt && test -f dist/404.html
          if grep -rl 'pinansyalph-v2/assets\|jervilangelo.github.io/pinansyalph-v2' dist --include='*.html'; then
            echo "::error::The build still references the old GitHub Pages path"; exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
